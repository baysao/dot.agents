skill: "egm-drift-report"
description: "Behavioral evaluation scenario suite for egm-drift-report skill."

scenarios:
  - scenario_id: "detect_all_drift"
    description: "Compares implemented code against design specs; verifies all documentation and implementation discrepancies are identified."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-drift-report/SKILL.md"
    turns:
      - user_input: "Run egm-drift-report on `docs/designs/drift_report.md` against implemented source files."
        assertions:
          - type: "required_pattern"
            pattern: "^## .+\\.md\\s*$"
            message: "Report must carry one section per design document, headed by the document name, which the strict format requires."
          - type: "required_pattern"
            pattern: "(?:^|\\s)(?:[\\w./-]+\\.(?:py|ts|tsx|js|go|rs|java|md)):\\d+"
            message: "Report must cite at least one concrete file:line, so a finding can be located rather than asserted."
          - type: "forbidden_pattern"
            pattern: "file inventory|undocumented|not referenced in (?:a|any) design"
            message: "Undocumented code is out of scope; reporting it means the unbounded filter has regressed."
